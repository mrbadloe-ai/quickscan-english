/* ── Reflection block ── */
.reflection-block{background:linear-gradient(135deg,var(--teal-light) 0%,#f0f8f8 100%);border:1.5px solid #b8d8d8;border-radius:10px;padding:28px;margin-top:20px;position:relative}
.reflection-block::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--teal),#4aafaf);border-radius:10px 10px 0 0}
.reflection-block h2{color:var(--teal);margin:0 0 4px;font-size:1.25rem}
.reflection-subtitle{color:#4a7a7a;font-size:.88rem;margin:0 0 20px;font-weight:600}
.reflection-letter{color:var(--ink);font-size:1.02rem;line-height:1.8;margin:0 0 24px}
.reflection-letter p{margin:0 0 16px}.reflection-letter p:last-child{margin-bottom:0}
.reflection-step{background:#fff;border-left:4px solid var(--teal);border-radius:0 6px 6px 0;padding:14px 16px;margin:20px 0 24px;font-size:.97rem;color:var(--ink)}
.reflection-step strong{display:block;font-size:.75rem;color:var(--teal);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;font-weight:900}

.prog-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:4px}

.programme-card p{color:var(--muted);margin:0 0 14px;font-size:.92rem}
.cta-btn{display:inline-block;background:var(--teal);color:#fff;font-weight:900;font-size:.92rem;padding:11px 20px;border-radius:6px;text-decoration:none;border:0;cursor:pointer}
.cta-btn:hover{background:#235555}
.cta-orange{background:var(--orange)}.cta-orange:hover{background:var(--orange-dark)}
.also-online{font-size:.75rem;background:#e8f4f4;color:var(--teal);padding:2px 8px;border-radius:4px;font-weight:700;margin-left:6px;vertical-align:middle}

@media print{.topbar,.btn-row,.progress,.reflection-block{display:none!important}.panel,.report-hero{box-shadow:none;break-inside:avoid}.report-grid{grid-template-columns:1fr}.chart-wrap{height:230px}}

// ── Profile matching logic ─────────────────────────────────────────────
function selectReflection(r) {
  const cells = r.cells;
  const top = r.topMoves[0];
  const avgGap = cells.reduce((s,c)=>s+c.abs,0)/cells.length;

  // Check for balanced profile
  if (avgGap < 0.6) return "Balanced-Low-Gap";

  // Check for multi-domain high gap
  const domainsWithGap = DOMAINS.filter(d =>
    ELEMENTS.some(e => r.scores[d.key][e.key].abs >= 1.2)
  ).length;
  if (domainsWithGap >= 3 && avgGap >= 1.2) return "Multi-High";

  // Special: high Fire at work
  if (top.element.key === "Fire" && top.domain.key === "Work" && top.now >= 4 && top.diff < 0) {
    return "Fire-Work-HighFire";
  }

  // Default: element + domain key
  const key = `${top.element.key}-${top.domain.key}`;
  if (REFLECTIONS[key]) return key;

  // Fallback: element only
  const elementKeys = Object.keys(REFLECTIONS).filter(k => k.startsWith(top.element.key));
  if (elementKeys.length) return elementKeys[0];

  return "Multi-High";
}

function selectProgramme(r, reflectionKey) {
  const refl = REFLECTIONS[reflectionKey];
  if (refl && refl.programme) return refl.programme;
  const avgGap = r.cells.reduce((s,c)=>s+c.abs,0)/r.cells.length;
  if (avgGap >= 1.2) return "executive";
  if (avgGap >= 0.8) return "workshop";
  return "keynote";
}

function calcReport(){const scores={},cells=[],signals=[];DOMAINS.forEach(d=>{scores[d.key]={};ELEMENTS.forEach(e=>{const answers=state.answers[d.key][e.key],now=round(avg(answers.map(a=>a.now))),desired=round(avg(answers.map(a=>a.desired))),diff=round(desired-now),abs=Math.abs(diff);scores[d.key][e.key]={now,desired,diff,abs};cells.push({domain:d,element:e,now,desired,diff,abs});answers.forEach((a,i)=>signals.push({domain:d,element:e,question:DATA[d.key][e.key][i],now:a.now,desired:a.desired,diff:a.desired-a.now,abs:Math.abs(a.desired-a.now)}));});});const topMoves=cells.slice().sort((a,b)=>b.abs-a.abs||b.desired-a.desired).slice(0,5),strengths=cells.filter(c=>c.now>=4&&c.abs<=.75).sort((a,b)=>b.now-a.now).slice(0,4),undercurrents=signals.filter(s=>s.abs>=3).sort((a,b)=>b.abs-a.abs).slice(0,4),patterns=detectPatterns(scores,topMoves,strengths);return{scores,cells,topMoves,strengths,undercurrents,patterns};}

function detectPatterns(scores,topMoves,strengths){const p=[],get=(d,e)=>scores[d][e],domainGap=d=>ELEMENTS.reduce((sum,e)=>sum+Math.max(0,get(d,e.key).diff),0);if(domainGap("Development")>=3.5)p.push({title:"U geeft uzelf minder ruimte om te groeien dan u zou willen",text:"Uw ontwikkelprofiel laat zien dat u zich op meerdere gebieden inhoudt. Er is potentieel. Hoeveel ruimte geeft u uzelf om het te benutten?"});if(get("Private","Air").diff<=-.75&&get("Work","Air").diff>=.75)p.push({title:"Het verschil rond Lucht valt op",text:"Privé voelt Lucht misschien als te veel beweging of prikkels. Op uw werk verlangt u juist naar vrijheid, creativiteit en een frisse blik. Waar geeft u uw levendigheid de ruimte en waar houdt u zich in?"});if(get("Work","Fire").now>=4&&get("Work","Water").diff>=.75)p.push({title:"Veel gedrevenheid en behoefte aan meer verbinding",text:"Uw werkprofiel toont gedrevenheid en Water vraagt om meer ruimte. Leiderschap wordt duurzamer als tempo, empathie en emotionele veiligheid samengaan."});if(get("Private","Fire").diff>=.75&&get("Private","Water").now>=4)p.push({title:"Harmonie kan uw Vuur temperen",text:"Verbinding lijkt aanwezig, terwijl Vuur meer ruimte vraagt. Onderzoek of harmonie soms ten koste gaat van uw verlangen, ambitie of grenzen."});if(strengths.length>=3&&topMoves[0]?.abs>=1)p.push({title:"Stabiliteit aan de oppervlakte, beweging daaronder",text:"Meerdere kwaliteiten zijn al sterk. Het grootste verschil kan laten zien waar uw leiderschap zich verder kan ontwikkelen."});if(!p.length)p.push({title:"Uw profiel vraagt om verfijning",text:"De verschillen zijn klein en de nuances tellen. Uw groei ligt waarschijnlijk in preciezer kiezen en eerder luisteren."});return p.slice(0,4)}

  Development:{
    Ether:{
      want:"In uw persoonlijke ontwikkeling verlangt u naar innerlijke ruimte. U wilt tijd om stil te staan en iets diepers te laten ontstaan. Die werkelijke stilte ontbreekt nu grotendeels.",

    Air:{

    Fire:{

      want:"Uw persoonlijke ontwikkeling vraagt om zelfcompassie. Kunt u eerlijk bij uzelf blijven zonder direct te willen verbeteren wat u aantreft? Groei beklijft vaak beter als die laag mee mag doen.",

const CORE_QUESTIONS={
  Private:{
    Ether:"Wat zou het betekenen om werkelijk aanwezig te zijn in uw eigen leven?",
    Air:"Wanneer deed u voor het laatst iets in uw privéleven puur voor uw plezier?",

    Water:"Is er een gesprek met iemand dichtbij u dat u uit de weg gaat?",
    Earth:"Welke kleine verandering in uw dagelijkse ritme zou u meer houvast geven?"
  },
  Work:{
    Ether:"Wat zou op uw werk nog de moeite waard zijn als alle verwachtingen wegvielen?",
    Air:"Wat zou u op het werk proberen als fouten maken veilig voelde?",
    Fire:"Wat staat u in vergaderingen telkens op het punt te zeggen?",
    Water:"Heeft uw team iets van u nodig dat u tot nu toe niet wilde geven?",

  Development:{

  }
};

function domainNarrative(d,ranked){
  const m=ranked[0];
  const narratives=PLAIN_NARRATIVES[d.key][m.element.key];
  return m.diff>0 ? narratives.want : narratives.have;
}

function coreQuestion(d,item){
  return CORE_QUESTIONS[d.key][item.element.key];
}

function nextStepText(r){
  if(state.person.goal==="Concrete first step") return "Begin waar het verschil tussen hoe het nu is en hoe u het wilt het grootst is. Daar kan een kleine verschuiving de meeste beweging geven.";
  if(state.person.goal==="Conversation starter") return "Gebruik dit profiel als vertrekpunt voor een gesprek over wat vaak onuitgesproken blijft: waar u sterk in bent, waar u zich inhoudt en welke steun u verder helpt.";
  return "Neem de tijd voor wat u het meest raakt in deze scan. U mag erbij stilstaan voordat u iets probeert op te lossen.";
}

function actionItems(r){
  const top=r.topMoves[0];
  const domainKey=top.domain.key;
  const elemKey=top.element.key;

  const ACTIONS={
    Private:{
      Ether:["Reserveer deze week dertig minuten zonder telefoon of agenda. Zoek een stille plek en merk op wat er naar boven komt.","Schrijf één ding op dat u in uw privéleven blijft uitstellen terwijl het u wel raakt.","Vertel iemand dichtbij u iets wat u normaal voor uzelf houdt."],
      Air:["Plan deze week iets zonder praktisch doel waar u echt plezier aan beleeft.","Doe één ding in uw dagelijkse routine anders en merk op hoe het voelt.","Ga twintig minuten naar buiten zonder bestemming of podcast."],
      Fire:["Schrijf op wat u in uw privéleven blijft verdragen terwijl het niet bij u past.","Zeg deze week één keer nee waar u uit gewoonte ja zou zeggen.","Spreek hardop uit wat u nu werkelijk wilt, voor uzelf of tegenover iemand die u vertrouwt."],
      Water:["Voer thuis één gesprek met uw telefoon in een andere kamer.","Vraag iemand dichtbij u hoe het gaat en wacht lang genoeg om het antwoord echt te horen.","Deel met iemand die u vertrouwt iets waarover u werkelijk onzeker bent."],
      Earth:["Kies één simpele routine die u ’s ochtends houvast geeft en doe die deze week elke dag.","Rond iets af wat half af is blijven liggen.","Maak één klein stukje ruimte in uw huis of agenda vrij dat u al een tijd bezighoudt."]
    },
    Work:{
      Ether:["Reserveer deze week tijd in uw agenda om na te denken, zonder dat u iets hoeft op te leveren.","Schrijf één vraag over uw werk op waarvoor u uzelf steeds geen tijd geeft.","Vraag uzelf af wat u hier nog betekenisvol zou vinden als niemand toekeek."],
      Air:["Pak één bekende werksituatie heel anders aan dan normaal.","Deel deze week een idee dat u meestal voor uzelf houdt omdat het ongebruikelijk voelt.","Wandel zonder telefoon vóór uw volgende belangrijke overleg of besluit."],
      Fire:["Zeg deze week op het werk één ding dat u normaal afzwakt of voor uzelf houdt.","Neem deze week één besluit zonder op consensus te wachten en neem er verantwoordelijkheid voor.","Schrijf op wat u op het werk het liefst wilt veranderen en waar u nog geen actie op heeft ondernomen."],
      Water:["Begin deze week één overleg door oprecht te vragen hoe het met de mensen gaat.","Voer één echt gesprek met een collega zonder agenda.","Benoem in uw team wat iedereen denkt en niemand zegt."],
      Earth:["Kies een project of taak die blijft slepen. Rond het af of besluit expliciet om ermee te stoppen.","Maak een eenvoudige weekstructuur voor uzelf en houd die vijf dagen aan.","Rond deze week iets af voordat u iets nieuws begint."]
    },
    Development:{
      Ether:["Neem deze week elke ochtend twintig minuten zonder telefoon, nieuws of podcast. Merk op wat er is.","Schrijf één overtuiging over uzelf op die u al jaren met u meedraagt en nog nooit heeft onderzocht.","Vraag uzelf dagelijks af wat u werkelijk denkt, los van wat u vindt dat u zou moeten denken."],
      Air:["Doe deze week één ding uit nieuwsgierigheid, zonder doel.","Lees iets wat buiten uw gebruikelijke vakgebied of belangstelling ligt.","Geef uzelf toestemming om iets dat u begonnen bent niet af te maken. Merk op hoe dat voelt."],
      Fire:["Schrijf op waar u over een jaar in uw ontwikkeling werkelijk wilt staan, los van wat haalbaar lijkt.","Kies een gewoonte of patroon waarvan u steeds zegt dat u het wilt veranderen. Zet deze week één concrete stap.","Vertel één persoon waar u aan werkt en waarom dat voor u belangrijk is."],
      Water:["Vraag uzelf aan het eind van elke dag deze week wat u vandaag werkelijk heeft gevoeld. Schrijf één zin.","Merk het op als u strenger voor uzelf bent dan voor iemand die u respecteert. Pauzeer even.","Doe deze week één ding puur voor uw eigen welzijn, zonder het te rechtvaardigen."],
      Earth:["Kies één inzicht dat terugkeert en schrijf drie concrete acties op waarmee u het in praktijk kunt brengen.","Maak een eenvoudig weekritme voor uw ontwikkeling en bescherm de tijd ervoor, al is het twintig minuten per dag.","Rond één boek, opname of oefening af waaraan u eerder bent begonnen."]
    }
  };

  const actions = ACTIONS[domainKey]?.[elemKey] || [
    "Kies deze week één situatie waarin u bewust let op wat er onder de oppervlakte speelt.",
    "Schrijf op welk patroon u het vaakst opmerkt en waartegen het u beschermt.",
    "Zet deze week één kleine stap naar de verandering die u wilt, ook als de omstandigheden nog niet ideaal zijn."
  ];

  if(r.patterns[0]) actions.push(`Neem deze vraag mee in een gesprek, in uw dagboek of naar een coachsessie: "${r.patterns[0].title}"`);
  return actions;
}

function avg(v){return v.reduce((s,x)=>s+x,0)/v.length}function round(v){return Math.round(v*10)/10}function signed(v){return `${v>0?"+":""}${round(v)}`}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
